# LLMPerf — Docker Desktop on Apple Silicon (M1 / M2 Ultra / M3)
#
# Host network yok. Ollama host'ta çalışır → host.docker.internal.
# llama-server /slots portları host script ile .llmperf-slots-ports dosyasına yazılır.
services:
  llmperf:
    build: .
    image: llmperf:mac-arm64
    platform: linux/arm64
    container_name: llmperf
    ports:
      - "${LLMPERF_PORT:-8080}:8080"
    environment:
      LLMPERF_OLLAMA_BASE_URL: ${LLMPERF_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LLMPERF_SLOTS_HOST: ${LLMPERF_SLOTS_HOST:-host.docker.internal}
      LLMPERF_SLOTS_PORTS_FILE: /app/.slots-ports
      LLMPERF_SLOTS_DISCOVER: ${LLMPERF_SLOTS_DISCOVER:-false}
      LLMPERF_POLL_INTERVAL_SEC: ${LLMPERF_POLL_INTERVAL_SEC:-0.4}
      LLMPERF_PROC_ROOT: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.llmperf-slots-ports:/app/.slots-ports:ro
    restart: unless-stopped
